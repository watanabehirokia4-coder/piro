<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    if(window.navigator.standalone && !sessionStorage.getItem("tsutae_fresh")){
      sessionStorage.setItem("tsutae_fresh","1");
      location.replace(location.pathname + "?_=" + Date.now());
    }
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="伝達">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>🍎 伝達</title>
<style>
  :root{
    --bg:#f7f6f3; --card:#ffffff; --card2:#f4f2ee; --card3:#eceae4; --line:#e5e2da;
    --text:#2b2a27; --sub:#8a8579; --accent:#e0483e; --accent2:#c53d33;
    --green:#2f9e58; --orange:#e08a2b; --red:#e0483e; --purple:#8b6bd1;
    --radius:14px; --shadow:0 3px 14px rgba(60,50,40,.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",Roboto,sans-serif;
    padding:0 0 92px; min-height:100vh; line-height:1.5;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(247,246,243,.88);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0));
    display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.02em; display:flex; align-items:center; gap:8px;}
  header .date-badge{font-size:13px; color:var(--sub);}
  main{max-width:660px; margin:0 auto; padding:16px;}
  .view{display:none;}
  .view.active{display:block;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px; box-shadow:var(--shadow);}
  .card h2{font-size:15px; margin:0 0 14px; color:var(--sub); font-weight:600; letter-spacing:.04em; display:flex; align-items:center; justify-content:space-between;}

  input,select,textarea,button{font-family:inherit;}
  input,select,textarea{
    background:var(--card2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:10px 11px; font-size:16px; outline:none; width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical; min-height:70px;}

  .btn{background:var(--accent); color:#fff; border:none; border-radius:11px; padding:11px 16px; font-size:15px; font-weight:700; cursor:pointer;}
  .btn:active{background:var(--accent2);}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 12px; font-size:13px; border-radius:9px;}
  .btn.danger{background:transparent; border:1px solid var(--red); color:var(--red);}

  .row{display:flex; gap:10px; align-items:center;}
  .row.between{justify-content:space-between;}
  .row.wrap{flex-wrap:wrap;}

  .icon-btn{background:none; border:none; color:var(--sub); font-size:18px; cursor:pointer; padding:6px 10px; border-radius:8px; flex-shrink:0;}
  .icon-btn:active{background:var(--card3); color:var(--text);}

  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{padding:7px 13px; border-radius:18px; border:1px solid var(--line); background:var(--card2); font-size:13px; cursor:pointer; user-select:none; transition:.1s; color:var(--text);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
  .chip .mark{margin-right:4px;}

  .memo-item{background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:9px;}
  .memo-item.editing{border-color:var(--accent);}
  .memo-item .meta{font-size:11px; color:var(--sub); margin-bottom:5px; display:flex; justify-content:space-between; align-items:center;}
  .memo-item .txt{white-space:pre-wrap; font-size:14.5px; word-break:break-word;}
  .memo-item .del{color:var(--sub); background:none; border:none; font-size:13px; cursor:pointer; padding:2px 4px;}
  .memo-item .del:active{color:var(--red);}
  .memo-item .edit,.personal-item .edit{color:var(--accent); background:none; border:none; font-size:13px; cursor:pointer; padding:2px 4px; margin-right:6px;}
  .edit-actions{display:flex; gap:8px; margin-top:10px;}

  .empty{color:var(--sub); font-size:13.5px; text-align:center; padding:22px 10px;}

  .subject-row{background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:9px; cursor:pointer;}
  .subject-row:active{background:var(--card3);}
  .subject-row .subj{font-size:15px; font-weight:700; margin-bottom:4px;}
  .subject-row .sub-meta{font-size:12px; color:var(--sub); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .subject-row .author{color:var(--accent); font-weight:600;}
  .seen-badge{font-size:11px; padding:2px 8px; border-radius:10px; background:var(--card3); color:var(--sub);}
  .seen-badge.full{color:var(--green);}

  .readbox{display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:13px; cursor:pointer;}
  .readbox .box{width:24px; height:24px; border-radius:7px; border:2px solid var(--sub); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .readbox.done{border-color:var(--green);}
  .readbox.done .box{border-color:var(--green); background:var(--green); color:#fff;}
  .readbox .lbl{font-size:14px; font-weight:600;}
  .readbox .sub{font-size:12px; color:var(--sub); margin-top:2px;}

  .personal-item{background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:9px; display:flex; gap:10px; align-items:flex-start;}
  .personal-item.editing{border-color:var(--accent);}
  .personal-item .box{width:24px; height:24px; border-radius:7px; border:2px solid var(--sub); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; margin-top:1px; background:var(--card);}
  .personal-item.read .box{border-color:var(--green); background:var(--green); color:#fff;}
  .personal-item .body{flex:1; min-width:0;}
  .personal-item .to{font-size:12px; color:var(--accent); font-weight:700; margin-bottom:3px;}
  .personal-item .txt{font-size:14.5px; white-space:pre-wrap; word-break:break-word;}
  .personal-item .meta{font-size:11px; color:var(--sub); margin-top:5px; display:flex; justify-content:space-between;}
  .personal-item .del{color:var(--sub); background:none; border:none; font-size:13px; cursor:pointer; padding:2px 4px;}
  .personal-item .del:active{color:var(--red);}

  .staff-item{display:flex; align-items:center; justify-content:space-between; background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:11px 13px; margin-bottom:8px;}
  .staff-item .name{font-size:15px; font-weight:600;}

  .backbar{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .backbar .btn.ghost{padding:8px 14px;}
  .detail-content{white-space:pre-wrap; font-size:15px; margin-bottom:16px; line-height:1.7;}

  .photo-field{margin-top:8px;}
  .photo-preview{position:relative; display:inline-block; margin-top:10px;}
  .photo-preview img{max-width:140px; max-height:140px; border-radius:10px; display:block; border:1px solid var(--line); object-fit:cover;}
  .photo-remove{position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%; background:#2b2a27; color:#fff; border:none; font-size:14px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;}

  .detail-photo{margin:0 0 16px;}
  .detail-photo img{max-width:100%; border-radius:12px; display:block; cursor:zoom-in;}

  .item-photo{margin-top:8px;}
  .item-photo img{max-width:100%; max-height:220px; border-radius:10px; display:block; cursor:zoom-in; border:1px solid var(--line);}

  .lightbox{position:fixed; inset:0; background:rgba(20,18,15,.92); z-index:60; display:none; align-items:center; justify-content:center; padding:24px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:10px;}

  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-head .label{font-size:15px; font-weight:700;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-wd{text-align:center; font-size:11px; color:var(--sub); font-weight:600; padding-bottom:4px;}
  .cal-day{position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:13.5px; cursor:pointer; background:var(--card2); color:var(--text);}
  .cal-day.blank{visibility:hidden; cursor:default;}
  .cal-day.has-entry{background:#fbe4d5; font-weight:700;}
  .cal-day.has-entry.unread{background:#fbdad5;}
  .cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
  .cal-day.selected{background:var(--accent); color:#fff; font-weight:700;}
  .cal-day .dot{position:absolute; bottom:4px; width:5px; height:5px; border-radius:50%; background:var(--green);}
  .cal-day.unread .dot{background:var(--red);}

  nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom,0);}
  nav.tabs button{flex:1; background:none; border:none; color:var(--sub); padding:10px 0 11px; cursor:pointer; font-size:11px; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav.tabs button .ico{font-size:20px;}
  nav.tabs button.active{color:var(--accent);}

  .toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px); background:#2b2a27; color:#fff; padding:11px 18px; border-radius:11px; font-size:13.5px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.25s; z-index:50;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <h1>🍎 <span id="headerTitle">その日の伝達</span></h1>
  <span class="date-badge" id="headerDate"></span>
</header>

<main>

  <!-- 今日の伝達 -->
  <section class="view active" id="view-daily">
    <div class="card">
      <h2>今日の伝達</h2>
      <div id="todayLabel" style="font-size:15px; font-weight:700; margin-bottom:12px; color:var(--sub);"></div>
      <div id="todayList"></div>
      <div class="readbox" id="readBox" style="margin-top:12px;">
        <div class="box" id="readBoxIcon"></div>
        <div>
          <div class="lbl" id="readBoxLabel">朝番:未読</div>
          <div class="sub" id="readBoxSub">タップで既読にする</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>伝達を残す</h2>
      <div class="cal-head">
        <button class="icon-btn" id="calPrev">◀</button>
        <span class="label" id="calLabel"></span>
        <button class="icon-btn" id="calNext">▶</button>
      </div>
      <div class="cal-grid" id="calWeekdays"></div>
      <div class="cal-grid" id="calGrid" style="margin-top:5px;"></div>

      <div class="row between" style="margin-top:16px; margin-bottom:10px;">
        <div id="writeLabel" style="font-size:15px; font-weight:700;"></div>
        <button class="btn ghost sm" id="writeToday">今日を選択</button>
      </div>
      <div id="dailyList"></div>
      <textarea id="dailyInput" placeholder="予約内容・両替の有無など&#10;（選んだ日付に向けて誰でも記入できます）"></textarea>
      <div class="photo-field">
        <input type="file" accept="image/*" id="dailyPhotoInput" style="display:none;">
        <button type="button" class="btn ghost sm" id="dailyPhotoBtn">📷 写真を追加</button>
        <div class="photo-preview" id="dailyPhotoPreview" style="display:none;">
          <img id="dailyPhotoPreviewImg" alt="">
          <button type="button" class="photo-remove" id="dailyPhotoRemove">×</button>
        </div>
      </div>
      <button class="btn block" id="dailyAdd" style="margin-top:10px;">追記する</button>
    </div>
  </section>

  <!-- 全体伝達 -->
  <section class="view" id="view-general">
    <div id="generalListView">
      <div class="card">
        <h2>新規作成</h2>
        <select id="genAuthor" style="margin-bottom:8px;"></select>
        <input type="text" id="genSubject" placeholder="件名" style="margin-bottom:8px;">
        <textarea id="genContent" placeholder="内容"></textarea>
        <div class="photo-field">
          <input type="file" accept="image/*" id="genPhotoInput" style="display:none;">
          <button type="button" class="btn ghost sm" id="genPhotoBtn">📷 写真を追加</button>
          <div class="photo-preview" id="genPhotoPreview" style="display:none;">
            <img id="genPhotoPreviewImg" alt="">
            <button type="button" class="photo-remove" id="genPhotoRemove">×</button>
          </div>
        </div>
        <button class="btn block" id="genAdd" style="margin-top:10px;">作成する</button>
      </div>
      <div class="card">
        <h2>件名一覧</h2>
        <div id="genList"></div>
      </div>
    </div>

    <div id="generalDetailView" style="display:none;">
      <div class="backbar">
        <button class="btn ghost sm" id="genBack">◀ 一覧へ</button>
        <button class="btn ghost sm" id="genEdit" style="margin-left:auto;">編集</button>
        <button class="btn danger sm" id="genDelete">削除</button>
      </div>
      <div class="card" id="genDetailReadView">
        <h2 id="genDetailSubject" style="font-size:18px; color:var(--text);"></h2>
        <div class="detail-content" id="genDetailContent"></div>
        <div class="detail-photo" id="genDetailPhoto" style="display:none;"></div>
        <div style="font-size:12px; color:var(--sub); margin-bottom:14px;" id="genDetailMeta"></div>
        <h2>見た人（自分の名前をタップ）</h2>
        <div class="chips" id="genSeenChips"></div>
      </div>
      <div class="card" id="genDetailEditView" style="display:none;">
        <h2>編集</h2>
        <select id="genEditAuthor" style="margin-bottom:8px;"></select>
        <input type="text" id="genEditSubject" placeholder="件名" style="margin-bottom:8px;">
        <textarea id="genEditContent" placeholder="内容"></textarea>
        <div class="photo-field" id="genEditPhotoRow"></div>
        <div class="edit-actions">
          <button class="btn sm" id="genEditSave">保存</button>
          <button class="btn ghost sm" id="genEditCancel">キャンセル</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 個人伝達 -->
  <section class="view" id="view-personal">
    <div class="card">
      <h2>新規作成</h2>
      <div class="row" style="margin-bottom:8px;">
        <select id="perFrom"></select>
        <span style="color:var(--sub); flex-shrink:0;">→</span>
        <select id="perTo"></select>
      </div>
      <textarea id="perText" placeholder="一言メモ"></textarea>
      <div class="photo-field">
        <input type="file" accept="image/*" id="perPhotoInput" style="display:none;">
        <button type="button" class="btn ghost sm" id="perPhotoBtn">📷 写真を追加</button>
        <div class="photo-preview" id="perPhotoPreview" style="display:none;">
          <img id="perPhotoPreviewImg" alt="">
          <button type="button" class="photo-remove" id="perPhotoRemove">×</button>
        </div>
      </div>
      <button class="btn block" id="perAdd" style="margin-top:10px;">送る</button>
    </div>
    <div class="card">
      <h2>
        伝達一覧
        <select id="perFilter" style="width:auto; padding:6px 10px; font-size:13px;"></select>
      </h2>
      <div id="perList"></div>
    </div>
  </section>

  <!-- スタッフ管理 -->
  <section class="view" id="view-staff">
    <div class="card">
      <h2>スタッフ追加</h2>
      <div class="row">
        <input type="text" id="staffInput" placeholder="名前">
        <button class="btn sm" id="staffAdd">追加</button>
      </div>
    </div>
    <div class="card">
      <h2>スタッフ一覧</h2>
      <div id="staffList"></div>
    </div>
  </section>

</main>

<nav class="tabs">
  <button class="active" data-view="daily"><span class="ico">📅</span>今日の伝達</button>
  <button data-view="general"><span class="ico">📢</span>全体伝達</button>
  <button data-view="personal"><span class="ico">👤</span>個人伝達</button>
  <button data-view="staff"><span class="ico">⚙️</span>スタッフ</button>
</nav>

<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>
<input type="file" accept="image/*" id="editPhotoInput" style="display:none;">

<script>
(function(){
  "use strict";
  const STAFF_KEY="tsutae_staff_v1";
  const DAILY_KEY="tsutae_daily_v1";
  const GENERAL_KEY="tsutae_general_v1";
  const PERSONAL_KEY="tsutae_personal_v1";
  const WEEKDAYS=["日","月","火","水","木","金","土"];
  const FIREBASE_BASE="https://kagurazyu-dentatsu-default-rtdb.asia-southeast1.firebasedatabase.app";

  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const p2=n=>String(n).padStart(2,"0");
  function jstNow(){const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+9*3600000);}
  function todayStr(){const d=jstNow();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
  function addDays(dateStr,n){const[y,m,d]=dateStr.split("-").map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);return dt.getFullYear()+"-"+p2(dt.getMonth()+1)+"-"+p2(dt.getDate());}
  function fmtDate(s){const[y,m,d]=s.split("-").map(Number);const wd=WEEKDAYS[new Date(y,m-1,d).getDay()];return `${y}年${m}月${d}日 (${wd})`;}
  function fmtDateTime(ts){const d=new Date(ts);const jd=new Date(d.getTime()+d.getTimezoneOffset()*60000+9*3600000);return `${jd.getMonth()+1}/${jd.getDate()} ${p2(jd.getHours())}:${p2(jd.getMinutes())}`;}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function loadJSON(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
  function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v));}

  let staff=loadJSON(STAFF_KEY,[]);
  let daily=loadJSON(DAILY_KEY,{});
  let general=loadJSON(GENERAL_KEY,[]);
  let personal=loadJSON(PERSONAL_KEY,[]);

  let currentDay=todayStr();
  let calYear=Number(currentDay.slice(0,4));
  let calMonth=Number(currentDay.slice(5,7))-1; // 0-indexed
  let openGeneralId=null;
  let genPhotoData=null;
  let perPhotoData=null;
  let dailyPhotoData=null;

  function readAndCompressImage(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const maxDim=1000;
          let w=img.width,h=img.height;
          if(w>maxDim||h>maxDim){
            if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
            else{w=Math.round(w*maxDim/h);h=maxDim;}
          }
          const canvas=document.createElement("canvas");
          canvas.width=w; canvas.height=h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL("image/jpeg",0.68));
        };
        img.onerror=()=>reject(new Error("image decode failed"));
        img.src=reader.result;
      };
      reader.onerror=()=>reject(new Error("file read failed"));
      reader.readAsDataURL(file);
    });
  }

  function openLightbox(src){
    if(!src) return;
    document.getElementById("lightboxImg").src=src;
    document.getElementById("lightbox").classList.add("show");
  }
  document.getElementById("lightbox").onclick=()=>{
    document.getElementById("lightbox").classList.remove("show");
  };

  // ---------- inline edit mode (shared photo picker) ----------
  let editingDailyId=null, editingDailyPhoto=null;
  let editingGeneral=false, editingGeneralPhoto=null;
  let editingPersonalId=null, editingPersonalPhoto=null;
  let editPhotoContext=null, editPhotoContainerId=null;

  function getEditPhoto(context){
    if(context==="daily") return editingDailyPhoto;
    if(context==="general") return editingGeneralPhoto;
    if(context==="personal") return editingPersonalPhoto;
  }
  function setEditPhoto(context,val){
    if(context==="daily") editingDailyPhoto=val;
    if(context==="general") editingGeneralPhoto=val;
    if(context==="personal") editingPersonalPhoto=val;
  }
  function renderPhotoEditRow(containerId,context){
    const box=document.getElementById(containerId);
    if(!box) return;
    const photo=getEditPhoto(context);
    box.innerHTML = photo
      ? `<div class="photo-preview"><img src="${photo}" alt=""><button type="button" class="photo-remove" data-photo-remove="1">×</button></div><button type="button" class="btn ghost sm" data-photo-change="1" style="margin-top:8px;">写真を変更</button>`
      : `<button type="button" class="btn ghost sm" data-photo-change="1">📷 写真を追加</button>`;
    const removeBtn=box.querySelector("[data-photo-remove]");
    if(removeBtn) removeBtn.onclick=()=>{ setEditPhoto(context,null); renderPhotoEditRow(containerId,context); };
    const changeBtn=box.querySelector("[data-photo-change]");
    if(changeBtn) changeBtn.onclick=()=>{
      editPhotoContext=context;
      editPhotoContainerId=containerId;
      document.getElementById("editPhotoInput").click();
    };
  }
  document.getElementById("editPhotoInput").onchange=async(e)=>{

  function savePersonal(){saveJSON(PERSONAL_KEY,personal); fbWrite("personal",personal);}

  // ---------- クラウド同期(Firebase Realtime Database) ----------
  function fbWrite(key,value){
    fetch(`${FIREBASE_BASE}/${key}.json`,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(value)
    }).catch(()=>{
      toast("オフラインのためこの端末にのみ保存しました");
    });
  }

  function mergeStaffLists(local,remote){
    const seen=new Set(); const out=[];
    [...(local||[]),...(remote||[])].forEach(n=>{
      if(n&&!seen.has(n)){ seen.add(n); out.push(n); }
    });
    return out;
  }
  function mergeById(local,remote){
    const map=new Map();
    [...(local||[]),...(remote||[])].forEach(item=>{ if(item&&item.id) map.set(item.id,item); });
    return Array.from(map.values());
  }
  function mergeDailyMaps(local,remote){
    const out={};
    const dates=new Set([...Object.keys(local||{}),...Object.keys(remote||{})]);
    dates.forEach(d=>{
      const l=(local&&local[d])||{memos:[],read:false,readAt:null};
      const r=(remote&&remote[d])||{memos:[],read:false,readAt:null};
      out[d]={
        memos:mergeById(l.memos,r.memos),
        read:!!(l.read||r.read),
        readAt:(r.read?r.readAt:l.readAt)||l.readAt||r.readAt||null
      };
    });
    return out;
  }

  function applyLocalData(key,value){
    if(key==="staff"){ staff=value||[]; saveJSON(STAFF_KEY,staff); }
    if(key==="daily"){ daily=value||{}; saveJSON(DAILY_KEY,daily); }
    if(key==="general"){ general=value||[]; saveJSON(GENERAL_KEY,general); }
    if(key==="personal"){ personal=value||[]; saveJSON(PERSONAL_KEY,personal); }
  }

  function currentView(){
    const b=document.querySelector("nav.tabs button.active");
    return b?b.dataset.view:"daily";
  }

  function onRemoteUpdate(key){
    const v=currentView();
    if(key==="staff"){
      if(v==="staff") renderStaff();
      else if(v==="general"&&!editingGeneral){
        if(document.getElementById("generalDetailView").style.display!=="none") renderGeneralDetail();
        else renderGeneralList();
      }
      else if(v==="personal"&&!editingPersonalId) renderPersonal();
      return;
    }
    if(key==="daily"&&v==="daily"&&!editingDailyId) renderDaily();
    if(key==="general"&&v==="general"&&!editingGeneral){
      if(document.getElementById("generalDetailView").style.display!=="none") renderGeneralDetail();
      else renderGeneralList();
    }
    if(key==="personal"&&v==="personal"&&!editingPersonalId) renderPersonal();
  }

  const SYNC_KEYS=["staff","daily","general","personal"];
  let firstSyncDone={staff:false,daily:false,general:false,personal:false};
  let everConnected=false;

  function applyRemoteOrSeed(key,remoteValue){
    if(!firstSyncDone[key]){
      firstSyncDone[key]=true;
      let merged;
      if(key==="staff") merged=mergeStaffLists(staff,remoteValue);
      else if(key==="daily") merged=mergeDailyMaps(daily,remoteValue);
      else merged=mergeById(key==="general"?general:personal,remoteValue);
      applyLocalData(key,merged);
      fbWrite(key,merged);
    }else{
      applyLocalData(key,remoteValue);
    }
    onRemoteUpdate(key);
  }

  function handleFirebaseEvent(evt){
    const path=evt.path;
    const data=evt.data;
    if(path==="/"){
      if(!everConnected){ everConnected=true; toast("他端末と同期しました"); }
      const obj=(data&&typeof data==="object")?data:{};
      SYNC_KEYS.forEach(k=>applyRemoteOrSeed(k,obj[k]));
      return;
    }
    const key=path.replace(/^\//,"").split("/")[0];
    if(SYNC_KEYS.includes(key)) applyRemoteOrSeed(key,data);
  }

  function startSync(){
    if(typeof EventSource==="undefined") return;
    try{
      const es=new EventSource(`${FIREBASE_BASE}/.json`);
      es.addEventListener("put",e=>{ try{ handleFirebaseEvent(JSON.parse(e.data)); }catch(err){} });
      es.addEventListener("patch",e=>{ try{ handleFirebaseEvent(JSON.parse(e.data)); }catch(err){} });
    }catch(err){}
  }

  function toast(msg){
    const t=document.getElementById("toast");
    t.textContent=msg;

  }

  function renderCalendar(){
    document.getElementById("calLabel").textContent=`${calYear}年${calMonth+1}月`;
    const wd=document.getElementById("calWeekdays");
    wd.innerHTML=WEEKDAYS.map(w=>`<div class="cal-wd">${w}</div>`).join("");

    const first=new Date(calYear,calMonth,1).getDay();
    const total=new Date(calYear,calMonth+1,0).getDate();
    const grid=document.getElementById("calGrid");
    let html="";
    for(let i=0;i<first;i++) html+=`<div class="cal-day blank"></div>`;
    for(let day=1;day<=total;day++){
      const dateStr=`${calYear}-${p2(calMonth+1)}-${p2(day)}`;
      const e=daily[dateStr];
      const hasMemo=e&&e.memos.length;
      const unread=hasMemo&&!e.read;
      const cls=["cal-day"];
      if(hasMemo) cls.push("has-entry");
      if(dateStr===todayStr()) cls.push("today");
      if(dateStr===currentDay) cls.push("selected");
      if(unread) cls.push("unread");
      html+=`<div class="${cls.join(" ")}" data-date="${dateStr}">${day}${hasMemo?'<span class="dot"></span>':""}</div>`;
    }
    grid.innerHTML=html;
    grid.querySelectorAll(".cal-day:not(.blank)").forEach(c=>{
      c.onclick=()=>setCurrentDay(c.dataset.date);
    });
  }

        </div>
      </div>
    `;
    }).join("");

    if(editingPersonalId){
      const editing=personal.find(p=>p.id===editingPersonalId);
      if(editing){
        document.getElementById("editPersonalFrom").innerHTML=staffOptionsHtml();
        document.getElementById("editPersonalTo").innerHTML=staffOptionsHtml();
        document.getElementById("editPersonalFrom").value=editing.from;
        document.getElementById("editPersonalTo").value=editing.to;
        renderPhotoEditRow("editPersonalPhotoRow","personal");
      }
    }

    list.querySelectorAll("[data-toggle]").forEach(el=>{
      el.onclick=()=>{
        const item=personal.find(p=>p.id===el.dataset.toggle);
        item.read=!item.read;
        item.readAt=item.read?Date.now():null;
        savePersonal();
        renderPersonal();
      };
    });
    list.querySelectorAll(".item-photo").forEach(el=>{
      el.onclick=()=>{
        const item=personal.find(p=>p.id===el.dataset.photo);
        if(item) openLightbox(item.photo);
      };
    });
    list.querySelectorAll(".del").forEach(btn=>{
      btn.onclick=()=>{
        personal=personal.filter(p=>p.id!==btn.dataset.id);
        savePersonal();
        renderPersonal();
      };
    });
    list.querySelectorAll("[data-edit-personal]").forEach(btn=>{
      btn.onclick=()=>{
        const item=personal.find(p=>p.id===btn.dataset.editPersonal);
        if(!item) return;
        editingPersonalId=item.id;
        editingPersonalPhoto=item.photo||null;
        renderPersonal();
      };
    });
    list.querySelectorAll("[data-cancel-personal]").forEach(btn=>{
      btn.onclick=()=>{
        editingPersonalId=null;
        editingPersonalPhoto=null;
        renderPersonal();
      };
    });
    list.querySelectorAll("[data-save-personal]").forEach(btn=>{
      btn.onclick=()=>{
        const item=personal.find(p=>p.id===btn.dataset.savePersonal);
        if(!item) return;
        const from=document.getElementById("editPersonalFrom").value;
        const to=document.getElementById("editPersonalTo").value;
        const text=document.getElementById("editPersonalText").value.trim();
        if(!from||!to||!text){ toast("差出人・宛先・内容を入力してください"); return; }
        const prev={from:item.from,to:item.to,text:item.text,photo:item.photo};
        item.from=from; item.to=to; item.text=text; item.photo=editingPersonalPhoto;
        try{
          savePersonal();
        }catch(err){
          Object.assign(item,prev);
          toast("保存に失敗しました(容量不足の可能性があります)");
          return;
        }
        editingPersonalId=null;
        editingPersonalPhoto=null;
        renderPersonal();
        toast("更新しました");
      };
    });
  }

  document.getElementById("perFilter").onchange=()=>{
    editingPersonalId=null;
    editingPersonalPhoto=null;
    renderPersonal();
  };

  function renderPerPhotoPreview(){
    const box=document.getElementById("perPhotoPreview");
    if(perPhotoData){
      document.getElementById("perPhotoPreviewImg").src=perPhotoData;
      box.style.display="";
    }else{
      box.style.display="none";
    }
  }
  document.getElementById("perPhotoBtn").onclick=()=>document.getElementById("perPhotoInput").click();
  document.getElementById("perPhotoInput").onchange=async(e)=>{
    const file=e.target.files[0];
    e.target.value="";
    if(!file) return;
    try{
      perPhotoData=await readAndCompressImage(file);
      renderPerPhotoPreview();
    }catch(err){
      toast("写真の読み込みに失敗しました");
    }
  };
  document.getElementById("perPhotoRemove").onclick=()=>{
    perPhotoData=null;
    renderPerPhotoPreview();
  };

  document.getElementById("perAdd").onclick=()=>{
    const fromSel=document.getElementById("perFrom");
    const toSel=document.getElementById("perTo");
    const textEl=document.getElementById("perText");
    const from=fromSel.value;
    const to=toSel.value;
    const text=textEl.value.trim();
    if(!from||!to||!text) return;
    const item={id:uid(),from,to,text,createdAt:Date.now(),read:false,readAt:null,photo:perPhotoData||null};
    personal.push(item);
    try{
      savePersonal();
    }catch(err){
      personal.pop();
      toast("保存に失敗しました(容量不足の可能性があります)");
      return;
    }
    textEl.value="";
    perPhotoData=null;
    renderPerPhotoPreview();
    renderPersonal();
    toast("送りました");
  };

  // ---------- スタッフ管理 ----------
  function renderStaff(){
    const list=document.getElementById("staffList");
    if(!staff.length){
      list.innerHTML=`<div class="empty">スタッフが登録されていません</div>`;
      return;
    }
    list.innerHTML=staff.map(n=>`
      <div class="staff-item">
        <span class="name">${escapeHtml(n)}</span>
        <button class="btn danger sm" data-name="${escapeHtml(n)}">削除</button>
      </div>
    `).join("");
    list.querySelectorAll("button[data-name]").forEach(btn=>{
      btn.onclick=()=>{
        const name=btn.dataset.name;
        if(!confirm(`「${name}」を削除しますか？`)) return;
        staff=staff.filter(n=>n!==name);
        saveStaff();
        renderStaff();
      };
    });
  }

  document.getElementById("staffAdd").onclick=()=>{
    const input=document.getElementById("staffInput");
    const name=input.value.trim();
    if(!name) return;
    if(staff.includes(name)){ toast("すでに登録されています"); return; }
    staff.push(name);
    input.value="";
    saveStaff();
    renderStaff();
    toast("追加しました");
  };

  // ---------- init ----------
  switchView("daily");
  startSync();
})();
</script>
</body>
</html>
